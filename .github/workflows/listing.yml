name: listing
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would change on Modrinth without sending it.'
        type: boolean
        default: false

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Wroud/github-workflows/actions/mod-listing@main
        with:
          dry-run: ${{ inputs.dry_run }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
